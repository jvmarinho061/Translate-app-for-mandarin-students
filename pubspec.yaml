name: pinyinapp
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  equatable: ^2.1.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  just_audio: ^0.10.6
  sqflite: ^2.4.3
  go_router: ^17.3.0
  flutter_bloc: ^9.1.1
  path: ^1.9.1
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  sqflite_common_ffi: ^2.4.2
flutter:
  uses-material-design: true

  assets:
    # Gerado por `dart run tool/build_dictionary.dart`.
    - assets/dictionary/cedict.sqlite

  fonts:
    # Fonte CJK embarcada, não baixada em runtime: sem ela o Android pode
    # escolher glifos regionais japoneses para caracteres chineses, e os
    # diacríticos de pinyin (ǚ, ǖ) viram caixas.
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
        - asset: assets/icons/cidian.png

